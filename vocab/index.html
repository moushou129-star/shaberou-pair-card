<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ことばカード</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;background:#f5f8fc;color:#17324d}.w{max-width:980px;margin:auto;padding:18px}h1{font-size:42px;margin:8px 0 4px}.sub{color:#718096;font-weight:700;margin-bottom:18px}.g{display:grid;grid-template-columns:280px 1fr;gap:18px}.p{background:#fff;border:1px solid #dde7f0;border-radius:22px;box-shadow:0 12px 30px rgba(40,80,120,.08);overflow:hidden}.hd{padding:15px 18px;border-bottom:1px solid #edf2f7;font-weight:900}.bd{padding:18px}.f{margin-bottom:15px}.l{font-size:14px;font-weight:900;margin-bottom:7px}select{width:100%;padding:11px;border:1px solid #d8e3ed;border-radius:12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg.three{grid-template-columns:repeat(3,1fr)}button{font:inherit}.seg button,.small{padding:10px;border:1px solid #dce7f0;background:#fff;border-radius:12px;font-weight:800;color:#45617f}.seg button.a{background:#edf7ff;border-color:#84bdff;color:#245e96}.small{width:100%;cursor:pointer}.primary{background:#17324d;color:#fff;border-color:#17324d}.study{padding:18px}.top{display:flex;justify-content:space-between;color:#5f7791;font-weight:800;font-size:14px;margin-bottom:10px}.bar{height:9px;background:#edf3f8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#78baff;width:0}.card{min-height:380px;border:1px solid #dce7f0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;position:relative;cursor:pointer;background:linear-gradient(#fff,#fbfdff)}.tag{position:absolute;top:16px;left:16px;background:#eef6ff;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.dir{position:absolute;top:16px;right:16px;color:#8397aa;font-size:12px;font-weight:800}.word{font-size:64px;font-weight:900}.reading{font-size:22px;color:#58728c;font-weight:800;margin-top:8px}.meaning{font-size:32px;font-weight:900;margin-top:14px}.meta{color:#657b91;font-weight:700;margin-top:12px}.pair{color:#8a5f94;font-weight:800;margin-top:8px}.ex{font-size:18px;margin-top:16px}.tap{position:absolute;bottom:16px;color:#9aabba;font-size:12px}.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.ans button{border:0;border-radius:13px;padding:14px 8px;font-weight:900;color:#fff}.ans button:disabled{opacity:.4}.k{background:#6fcf97}.m{background:#f6c85f;color:#5b4a16!important}.u{background:#ef6b73}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.s{background:#fff;border:1px solid #e1eaf2;border-radius:14px;padding:10px;text-align:center}.n{font-size:21px;font-weight:900}.t{font-size:11px;color:#7e91a4}.empty{text-align:center;padding:60px 20px;color:#718096;font-weight:800}@media(max-width:760px){.g{grid-template-columns:1fr}.word{font-size:50px}.stats{grid-template-columns:repeat(2,1fr)}}</style><div class="w"><h1>ことばカード</h1><div class="sub">日语单词刷词器｜认识・模糊・不认识</div><div class="g"><aside class="p"><div class="hd">学习设置</div><div class="bd"><div class="f"><div class="l">课次</div><select id="lesson"></select></div><div class="f"><div class="l">出题方向</div><div class="seg" id="direction"><button data-v="jp-cn" class="a">日 → 中</button><button data-v="cn-jp">中 → 日</button></div></div><div class="f"><div class="l">学习范围</div><div class="seg three" id="scope"><button data-v="all" class="a">全部</button><button data-v="unknown">错词</button><button data-v="fuzzy">模糊</button></div></div><div class="f"><div class="l">顺序</div><div class="seg" id="order"><button data-v="random" class="a">随机</button><button data-v="normal">顺序</button></div></div><div class="f"><button class="small primary" id="restart">重新开始本轮</button></div><button class="small" id="clear">清除本机记录</button></div></aside><main class="p"><div class="hd">刷词</div><div class="study"><div class="top"><div><span id="prog">0 / 0</span><div class="bar"><i id="fill"></i></div></div><div id="rate">掌握率 0%</div></div><div id="area"></div><div class="stats"><div class="s"><div class="n" id="st">0</div><div class="t">本轮</div></div><div class="s"><div class="n" id="sk">0</div><div class="t">认识</div></div><div class="s"><div class="n" id="sf">0</div><div class="t">模糊</div></div><div class="s"><div class="n" id="su">0</div><div class="t">不认识</div></div></div></div></main></div></div><script>const L={'第1课':[{jp:'学生',r:'がくせい',cn:'学生',p:'名词',e:'私は学生です。'},{jp:'先生',r:'せんせい',cn:'老师',p:'名词',e:'田中さんは日本語の先生です。'},{jp:'会社員',r:'かいしゃいん',cn:'公司职员',p:'名词',e:'兄は会社員です。'},{jp:'日本',r:'にほん',cn:'日本',p:'名词',e:'日本に住んでいます。'},{jp:'中国',r:'ちゅうごく',cn:'中国',p:'名词',e:'中国から来ました。'}],'第2课':[{jp:'これ',r:'これ',cn:'这个',p:'指示词',e:'これは本です。'},{jp:'それ',r:'それ',cn:'那个（靠近对方）',p:'指示词',e:'それは何ですか。'},{jp:'あれ',r:'あれ',cn:'那个（远离双方）',p:'指示词',e:'あれは図書館です。'},{jp:'本',r:'ほん',cn:'书',p:'名词',e:'この本は面白いです。'},{jp:'辞書',r:'じしょ',cn:'词典',p:'名词',e:'辞書を使います。'}],'动词示例':[{jp:'開ける',r:'あける',cn:'打开（他）',p:'二类动词・他动词',pair:'開く（あく）｜自动词',e:'窓を開けます。'},{jp:'開く',r:'あく',cn:'打开（自）',p:'一类动词・自动词',pair:'開ける（あける）｜他动词',e:'ドアが開きました。'},{jp:'付ける',r:'つける',cn:'打开／附上（他）',p:'二类动词・他动词',pair:'付く（つく）｜自动词',e:'電気を付けます。'},{jp:'付く',r:'つく',cn:'亮起／附着（自）',p:'一类动词・自动词',pair:'付ける（つける）｜他动词',e:'電気が付きました。'}]};const $=x=>document.getElementById(x),K='kotoba-card-v1';let pref={lesson:'第1课',direction:'jp-cn',scope:'all',order:'random'},q=[],i=0,rev=false,round={know:0,fuzzy:0,unknown:0},hist=JSON.parse(localStorage.getItem(K)||'{}');function key(w){return pref.lesson+'::'+w.jp}function save(){localStorage.setItem(K,JSON.stringify(hist))}Object.keys(L).forEach(x=>{let o=document.createElement('option');o.value=o.textContent=x;$('lesson').appendChild(o)});$('lesson').onchange=()=>{pref.lesson=$('lesson').value;start()};function bind(id,p){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.remove('a'));b.classList.add('a');pref[p]=b.dataset.v;start()})}bind('direction','direction');bind('scope','scope');bind('order','order');function shuffle(a){a=[...a];for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function start(){q=[...L[pref.lesson]];if(pref.scope!=='all')q=q.filter(w=>hist[key(w)]===pref.scope);if(pref.order==='random')q=shuffle(q);i=0;rev=false;round={know:0,fuzzy:0,unknown:0};render()}function render(){let n=q.length,answered=round.know+round.fuzzy+round.unknown;$('prog').textContent=(n?Math.min(i+1,n):0)+' / '+n;$('fill').style.width=(n?Math.min(i,n)/n*100:0)+'%';$('rate').textContent='掌握率 '+(answered?Math.round(round.know/answered*100):0)+'%';$('st').textContent=n;$('sk').textContent=round.know;$('sf').textContent=round.fuzzy;$('su').textContent=round.unknown;if(!n){$('area').innerHTML='<div class="empty">这个范围暂时没有单词。</div>';return}if(i>=n){$('fill').style.width='100%';$('area').innerHTML='<div class="empty"><div style="font-size:30px;color:#17324d;margin-bottom:10px">本轮完成！</div>认识 '+round.know+'　模糊 '+round.fuzzy+'　不认识 '+round.unknown+'<br><br><button class="small primary" onclick="start()" style="max-width:220px">再刷一轮</button></div>';return}let w=q[i],front=pref.direction==='jp-cn'?w.jp:w.cn,back=pref.direction==='jp-cn'?w.cn:w.jp;$('area').innerHTML='<div class="card" id="card"><div class="tag">'+pref.lesson+'</div><div class="dir">'+(pref.direction==='jp-cn'?'日 → 中':'中 → 日')+'</div><div class="word">'+front+'</div><div id="detail" style="display:none"><div class="reading">'+w.r+'</div><div class="meaning">'+back+'</div><div class="meta">'+w.p+'</div>'+(w.pair?'<div class="pair">↔ '+w.pair+'</div>':'')+'<div class="ex">'+w.e+'</div></div><div class="tap">点击卡片查看答案</div></div><div class="ans"><button class="k" disabled>〇 认识</button><button class="m" disabled>△ 模糊</button><button class="u" disabled>× 不认识</button></div>';let c=$('card'),d=$('detail'),bs=$('area').querySelectorAll('.ans button');c.onclick=()=>{rev=true;d.style.display='block';c.querySelector('.tap').textContent='请选择掌握程度';bs.forEach(b=>b.disabled=false)};['know','fuzzy','unknown'].forEach((v,x)=>bs[x].onclick=()=>mark(v,w))}function mark(v,w){if(!rev)return;round[v]++;hist[key(w)]=v;save();i++;rev=false;render()}$('restart').onclick=start;$('clear').onclick=()=>{if(confirm('清除这个浏览器里的学习记录吗？')){hist={};save();start()}};start()</script>
